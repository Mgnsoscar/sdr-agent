# ──────────────────────────────────────────────────────────────────────────────
# SDR Agent — Task Registry
#
# Ships EMPTY. Tasks (and the scripts they run) are authored on the PC and
# deployed to a unit from the client's Library — the agent is a blank slate until
# then. Add entries here only if you want to bake a task into the image.
#
# Fields: name (required, unique), description, command (list: exe + args, absolute
# paths), working_dir, env, autostart, restart_on_crash, restart_delay_s.
# The agent reads this file at startup only — restart the agent to pick up changes.
# ──────────────────────────────────────────────────────────────────────────────

tasks: []
