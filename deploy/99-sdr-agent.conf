# SDR agent — kernel tuning for GNU Radio transmit tasks.
# Installed to /etc/sysctl.d/99-sdr-agent.conf by the provision/migrate/x410 install scripts
# (docs/rf-fault-recovery.md §3.4). The 99- prefix wins over distro defaults; persists across
# reboot on the Pi (it's in /etc). On the X410 /etc is on rootfs, so a full NI OS image update
# wipes it — re-running install.sh re-establishes it, like the unit file and symlink.

# GNU Radio's vmcircbuf inter-block buffers are each mapped TWICE into the process address space,
# so a flowgraph consumes memory-map entries fast. Raise the per-process ceiling well above the
# 65530 default so a large, high-rate flowgraph (e.g. fm_chirp at 61.38 Msps) can't exhaust it at
# construction — one of the candidate causes of the startup `vmcircbuf` allocation failure.
vm.max_map_count = 262144
